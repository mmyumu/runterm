name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const cargo = (p) => fs.readFileSync(p, "utf8").match(/^version = "([^"]+)"/m)[1];
            const versions = {
              "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              "src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              "src-tauri/Cargo.toml": cargo("src-tauri/Cargo.toml"),
              "crates/core/Cargo.toml": cargo("crates/core/Cargo.toml"),
            };
            let ok = true;
            for (const [file, version] of Object.entries(versions)) {
              if (version !== tag) {
                console.error(`${file} has version ${version}, tag is ${process.env.TAG}`);
                ok = false;
              }
            }
            if (!ok) process.exit(1);
          '
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: npm ci
      - run: npm run check
      - run: cargo test -p runterm-core --locked
      - run: cargo test -p runterm --locked
      - name: Build the installer
        run: npm run tauri -- build
        env:
          # Used only once the updater is enabled (bundle.createUpdaterArtifacts).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect release files
        run: |
          version="${TAG#v}"
          setup="RunTerm_${version}_x64-setup.exe"
          mkdir release
          cp "target/release/bundle/nsis/$setup" release/
          cp target/release/runterm.exe release/RunTerm.exe
          (cd release && sha256sum RunTerm.exe "$setup" > SHA256SUMS.txt)

          sig="target/release/bundle/nsis/$setup.sig"
          if [[ -f "$sig" ]]; then
            cp "$sig" release/
            SIGNATURE="$(cat "$sig")" \
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" \
            NOTES="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            VERSION="$version" \
            node -e '
              const e = process.env;
              const manifest = {
                version: e.VERSION,
                notes: e.NOTES,
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": { signature: e.SIGNATURE, url: e.URL } },
              };
              require("fs").writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2) + "\n");
            '
          fi
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the GitHub release
        run: |
          flags=()
          # v1.2.0-beta.1 is published as a prerelease, so /releases/latest keeps pointing to the last stable version.
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "RunTerm $TAG" \
            --generate-notes \
            "${flags[@]}"
