name: Checks and Windows installer
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: cargo test -p runterm-core --locked
      - run: cargo clippy -p runterm-core --all-targets --locked -- -D warnings
  windows:
    # release.yml builds and tests the same commit from its tag; one is enough.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      # The 480-odd dependencies dominate this job; release.yml shares the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: npm ci
      # The frontend and runterm-core are checked on Linux; `tauri build` runs
      # `npm run build` itself. Tested in release so the build reuses the
      # dependencies instead of compiling them a second time in debug.
      - run: cargo test -p runterm --locked --release
      - run: npm run tauri -- build --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: RunTerm-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
