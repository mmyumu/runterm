name: Checks and Windows installer
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: cargo fmt --all --check
      - run: cargo test -p runterm-core --locked
      - run: cargo clippy -p runterm-core --all-targets --locked -- -D warnings
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: npm ci
      - run: npm run check
      - run: cargo test -p runterm-core --locked
      - run: cargo test -p runterm --locked
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: RunTerm-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
